# Sends every request to the active copy of the web app: web-blue until switch.sh writes
# /etc/nginx/active.conf, which sets $active to the other one.

# One JSON line per request, which scripts/monitoring reads like App Insights reads requests.
log_format json escape=json '{"time":"$time_iso8601","status":"$status","request_time":"$request_time",'
                            '"method":"$request_method","uri":"$request_uri","served_by":"$active"}';

server {
    listen 80;

    access_log /var/log/nginx/access.log json;

    # Docker's DNS, so the copy named in $active is resolved at request time.
    resolver 127.0.0.11 valid=10s;

    set $active web-blue;
    include /etc/nginx/active*.conf;

    location / {
        proxy_pass http://$active:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Which copy answered, to see the switch from outside.
        add_header X-Served-By $active always;
    }
}
