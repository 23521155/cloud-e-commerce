# Blue/green deployment of the web app behind Nginx: the open-source counterpart of App Service
# deployment slots. Two copies of the same image run side by side; switch.sh points Nginx at the
# other copy and reloads it gracefully. The copies use the real API gateway on Azure.
#
#   $env:GATEWAY_API_URL = "https://<gateway fqdn>"
#   docker compose -f scripts/bluegreen/compose.yaml up -d --build
#   curl.exe -sI http://localhost:8088/              # X-Served-By: web-blue
#   docker compose -f scripts/bluegreen/compose.yaml exec nginx sh /switch.sh green
name: bluegreen

x-web: &web
  build: ../../apps/web
  image: bluegreen-web
  restart: unless-stopped
  environment:
    GATEWAY_API_URL: ${GATEWAY_API_URL:?set GATEWAY_API_URL to the API gateway URL}
    # One cache for both copies, as both slots share the Azure Redis.
    REDIS_URL: redis://redis:6379
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  web-blue: *web

  web-green: *web

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${BLUEGREEN_PORT:-8088}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./switch.sh:/switch.sh:ro
    depends_on:
      - web-blue
      - web-green
