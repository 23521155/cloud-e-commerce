# order-service and its own SQL Server (database per service).
# Start order: order-db -> order-db-init -> order-migrate -> order-service.
# Both jobs are idempotent, so `docker compose up` can be run again at any time.

x-order-database-url: &order-database-url sqlserver://sa:${ORDER_DB_PASSWORD:-Order_dev_123}@order-db:1433?database=orders&encrypt=true&trustServerCertificate=true

services:
  order-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${ORDER_DB_PASSWORD:-Order_dev_123}
    ports:
      # 1435 on the host so it does not clash with SQL Server on 1433 or catalog-db on 1434
      - "${ORDER_DB_PORT:-1435}:1433"
    volumes:
      - order-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # SQL Server starts empty: create the orders database once.
  order-db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: "no"
    depends_on:
      order-db:
        condition: service_healthy
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd"]
    command:
      - -S
      - order-db
      - -U
      - sa
      - -P
      - ${ORDER_DB_PASSWORD:-Order_dev_123}
      - -C
      - -b
      - -Q
      - IF DB_ID('orders') IS NULL CREATE DATABASE orders

  order-migrate:
    image: migrate/migrate:v4.20.1
    restart: "no"
    depends_on:
      order-db-init:
        condition: service_completed_successfully
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=sqlserver://sa:${ORDER_DB_PASSWORD:-Order_dev_123}@order-db:1433?database=orders&encrypt=true&trustServerCertificate=true
      - up

  order-service:
    image: order-service:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      order-migrate:
        condition: service_completed_successfully
    environment:
      PORT: "8084"
      GIN_MODE: release
      DATABASE_URL: *order-database-url
    ports:
      - "${ORDER_PORT:-8084}:8084"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  order-db-data:
