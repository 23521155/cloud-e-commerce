# The Azure Functions app (sendEmail) on the Functions host, reading the queues in Azurite and
# sending email to Mailpit (infra/compose.yaml). Open http://localhost:8025 to read what it sent.

services:
  functions:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Azurite's well-known development account, reached by its compose name.
      AzureWebJobsStorage: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      FUNCTIONS_WORKER_RUNTIME: node
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: Marginalleya <no-reply@marginalleya.local>
    ports:
      - "${FUNCTIONS_PORT:-7071}:80"
    depends_on:
      - azurite
      - mailpit
