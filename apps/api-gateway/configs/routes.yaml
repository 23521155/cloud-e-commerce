routes:

  - name: user
    prefix: /api/users
    upstream: ${USER_SERVICE}

    timeout: 5s

    retry:
      attempts: 3
      base_delay: 1s
      max_delay: 3s

    breaker:
      enabled: true

    # One bucket for sign-in and for the reader's own account (/me is read by the
    # account and checkout pages), per user when signed in, else per IP. 10/min
    # starved those reads; 60/min still bounds password guessing per IP.
    rate_limit:
      requests: 60
      window: 1m
      burst: 20

    auth_mode: optional

    # multipart/form-data only: profile avatar (5 MB) and cover (10 MB)
    # uploads. Body cap = 11 MB (11 * 1024 * 1024) to cover multipart overhead.
    upload:
      timeout: 30s
      max_body_bytes: 11534336

  # Public catalogue. The gateway strips /api/catalog, so catalog-service
  # serves /books, /books/:slug, /books/:slug/related and /subjects at its root.
  - name: catalog
    prefix: /api/catalog
    upstream: ${CATALOG_SERVICE}

    timeout: 5s

    retry:
      attempts: 3
      base_delay: 1s
      max_delay: 3s

    breaker:
      enabled: true

    rate_limit:
      requests: 120
      window: 1m
      burst: 30

    auth_mode: optional

  # Checkout is open to guests: with a token the gateway forwards the user,
  # without one the order is created as a guest order.
  # attempts: 1 — retrying a POST that timed out could create a duplicate order.
  - name: orders
    prefix: /api/orders
    upstream: ${ORDER_SERVICE}

    timeout: 5s

    retry:
      attempts: 1
      base_delay: 1s
      max_delay: 3s

    breaker:
      enabled: true

    rate_limit:
      requests: 30
      window: 1m
      burst: 10

    auth_mode: optional

  # Server-side cart for signed-in users (guests keep theirs in localStorage).
  # Lives in order-service for now; split it out by changing only the upstream.
  - name: cart
    prefix: /api/cart
    upstream: ${ORDER_SERVICE}

    timeout: 5s

    retry:
      attempts: 1
      base_delay: 1s
      max_delay: 3s

    breaker:
      enabled: true

    rate_limit:
      requests: 120
      window: 1m
      burst: 30

    auth_mode: required
