# user-service and its own SQL Server (database per service).
# Start order: users-db -> users-db-init -> users-migrate -> user-service.
# Both jobs are idempotent, so `docker compose up` can be run again at any time.

x-users-database-url: &users-database-url sqlserver://sa:${USERS_DB_PASSWORD:-Users_dev_123}@users-db:1433?database=users&encrypt=true&trustServerCertificate=true

services:
  users-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${USERS_DB_PASSWORD:-Users_dev_123}
    ports:
      # 1436 on the host so it does not clash with SQL Server on 1433, catalog-db on 1434 or order-db on 1435
      - "${USERS_DB_PORT:-1436}:1433"
    volumes:
      - users-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # SQL Server starts empty: create the users database once.
  users-db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: "no"
    depends_on:
      users-db:
        condition: service_healthy
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd"]
    command:
      - -S
      - users-db
      - -U
      - sa
      - -P
      - ${USERS_DB_PASSWORD:-Users_dev_123}
      - -C
      - -b
      - -Q
      - IF DB_ID('users') IS NULL CREATE DATABASE users

  users-migrate:
    image: migrate/migrate:v4.20.1
    restart: "no"
    depends_on:
      users-db-init:
        condition: service_completed_successfully
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=sqlserver://sa:${USERS_DB_PASSWORD:-Users_dev_123}@users-db:1433?database=users&encrypt=true&trustServerCertificate=true
      - up

  user-service:
    image: user-service:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      users-migrate:
        condition: service_completed_successfully
    environment:
      PORT: "8085"
      GIN_MODE: release
      DATABASE_URL: *users-database-url
      # Same values as the gateway, which verifies the tokens; dev defaults only.
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
      JWT_ISSUER: ${JWT_ISSUER:-fiurozz}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}
      # Encrypts TOTP secrets; dev default only (base64 of 32 bytes).
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-ZGV2LW9ubHktbWZhLWtleS0zMi1ieXRlcy1sb25nISE=}
      # The web dev server, for the links in emails.
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      # Google sign-in, from a .env next to the compose file you run (never committed); empty turns it off.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Azurite's well-known development account (infra/compose.yaml); the outbox relay writes the
      # email-outbox queue there and the sendEmail Function reads it.
      STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;QueueEndpoint=http://azurite:10001/devstoreaccount1;
    ports:
      - "${USER_PORT:-8085}:8085"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  users-db-data:
